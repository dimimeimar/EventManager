<section class="narrow">
  <h2>Εξαγωγή δεδομένων</h2>
  <div class="card">
    <p>
      Κατεβάζει όλες τις εκδηλώσεις με τους τύπους εισιτηρίων, τις φωτογραφίες και τις κρατήσεις τους.
      Το XML ακολουθεί το DTD της εκφώνησης (περιλαμβάνεται μέσα στο αρχείο) και το JSON έχει την ίδια δομή.
    </p>
    <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
    <div class="actions">
      <button type="button" class="button" [disabled]="busy()" (click)="download('json')">Λήψη JSON</button>
      <button type="button" class="button" [disabled]="busy()" (click)="download('xml')">Λήψη XML</button>
    </div>
  </div>
</section>
