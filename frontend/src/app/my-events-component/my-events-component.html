<section>
  <h2>Οι εκδηλώσεις μου</h2>
  <p><a class="button" routerLink="/events/new">Νέα εκδήλωση</a></p>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  <p class="muted" *ngIf="events().length === 0">Δεν έχεις δημιουργήσει εκδηλώσεις ακόμα.</p>

  <table *ngIf="events().length > 0">
    <thead>
      <tr>
        <th>Τίτλος</th>
        <th>Ημερομηνία</th>
        <th>Πόλη</th>
        <th>Κατάσταση</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of events()">
        <td><a [routerLink]="['/events', e.id]">{{ e.title }}</a></td>
        <td>{{ e.startDateTime | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ e.city }}</td>
        <td>{{ e.status | eventStatus }}</td>
        <td class="actions">
          <a class="button small secondary" *ngIf="e.status === 'DRAFT' || e.status === 'PUBLISHED'" [routerLink]="['/events', e.id, 'edit']">Επεξεργασία</a>
          <button type="button" class="button small" *ngIf="e.status === 'DRAFT'" (click)="publish(e)">Δημοσίευση</button>
          <button type="button" class="button small danger" *ngIf="e.status === 'PUBLISHED'" (click)="cancel(e)">Ακύρωση</button>
          <button type="button" class="button small danger" *ngIf="e.status !== 'COMPLETED'" (click)="remove(e)">Διαγραφή</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
